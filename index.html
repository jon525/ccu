<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1418" media="(prefers-color-scheme: dark)">
<title>CCU Fault List</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--fg:#17202a;--muted:#5b6672;--line:#d9dee4;--accent:#1f5f8b;--bad:#b42318;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--surface:#171e24;--fg:#e4e9ee;--muted:#93a0ad;--line:#2a343d;--accent:#7fb6dd;--bad:#ff8a7a;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#gate{min-height:100svh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#gate form{width:100%;max-width:340px;display:grid;gap:12px}
#gate h1{margin:0;font-size:1.5rem}
#gate p{margin:0;color:var(--muted);font-size:.9rem}
#gate input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
#gate input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
#gate label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
#gate button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);cursor:pointer}
#gate button:disabled{opacity:.6}
#msg{min-height:1.4em;font-size:.88rem;color:var(--bad)}
.lockbtn{font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div id="gate">
  <form id="f" autocomplete="off">
    <h1>CCU Fault List</h1>
    <p>Enter the password to open the fault list and drawings.</p>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <label><input id="rem" type="checkbox" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <div id="msg" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<script>
const CFG={"salt": "9F/zJ4XBKKLADgoiGYxmzw==", "iter": 600000};
const KEYNAME="ccu-key";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=new TextEncoder();
let KEY=null; const cache=new Map();

async function derive(pw){
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(CFG.salt),iterations:CFG.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function fetchDec(path,key){
  const r=await fetch(path,{cache:"no-cache"}); if(!r.ok) throw new Error("missing "+path);
  const b=new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));
}
window.__ccuLoad=function(path){
  if(!cache.has(path)) cache.set(path,fetchDec("data/"+path.split("/").pop()+".bin",KEY).then(buf=>{
    const t=path.endsWith(".png")?"image/png":"image/jpeg"; return URL.createObjectURL(new Blob([buf],{type:t}));}));
  return cache.get(path);
};

async function open_(key){
  const buf=await fetchDec("data/app.bin",key); // throws if the key is wrong
  KEY=key;
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(buf),"text/html");
  const app=document.getElementById("app");
  doc.querySelectorAll("link,style").forEach(n=>document.head.appendChild(n));
  const scripts=[...doc.querySelectorAll("script")]; scripts.forEach(s=>s.remove());
  app.append(...doc.body.childNodes);
  document.getElementById("gate").remove(); app.hidden=false;
  const h=app.querySelector("header"); if(h){const b=document.createElement("button");b.className="lockbtn";b.type="button";b.textContent="Lock";
    b.onclick=()=>{try{localStorage.removeItem(KEYNAME)}catch(e){} location.reload();};h.appendChild(b);}
  for(const s of scripts){const n=document.createElement("script");n.textContent=s.textContent;document.body.appendChild(n);}
}

document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=document.getElementById("go"),msg=document.getElementById("msg");
  go.disabled=true; go.textContent="Unlocking…"; msg.textContent="";
  try{
    const key=await derive(document.getElementById("pw").value);
    await open_(key);
    if(document.getElementById("rem")?.checked!==false){
      try{const raw=await crypto.subtle.exportKey("raw",key);localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){}
    }
  }catch(err){
    go.disabled=false; go.textContent="Unlock";
    msg.textContent=window.isSecureContext?"That password didn't work. Check it and try again.":"This page must be opened over https to unlock.";
  }
});

(async()=>{
  let saved=null; try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved){try{const key=await crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},true,["decrypt"]);await open_(key);return;}catch(e){try{localStorage.removeItem(KEYNAME)}catch(_){}}}
  document.getElementById("pw").focus();
})();
</script>
</body>
</html>
